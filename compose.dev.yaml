services:
  web:
    build: ./news_feed
    image: web:1.0.0
    container_name: web
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./news_feed:/usr/src/myapp
    restart: unless-stopped
    env_file:
      - ./news_feed/.env.dev
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    environment:
      POSTGRES_USER: home
      POSTGRES_PASSWORD: home
      POSTGRES_DB: home
  
  dbbrowser:
    image: adminer
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
  
  api:
    build: ./api
    image: api:1.0.0
    container_name: api
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "9000:8000"
    volumes:
      - ./api:/usr/src/myapp
    env_file:
      - ./api/.env.dev
    restart: unless-stopped
    depends_on:
      - db

volumes:
  postgres_data: